# Planted breaking change for the oasdiff gate (P3-02): contracts/openapi.yaml with the required V-03 response
# property `permissions` removed. `pnpm contract:diff contracts/openapi.yaml <this file>` must exit non-zero.
openapi: 3.1.0
info:
